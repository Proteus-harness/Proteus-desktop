[package]
name = "proteus-terminal"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[features]
ghostty-vt = ["dep:ghostty-vt", "dep:portable-pty", "dep:libc"]

[dependencies]
alacritty_terminal = "0.25"
anyhow = "1"
async-channel = "2"
ghostty-vt = { version = "=0.8.0", default-features = false, optional = true }
portable-pty = { version = "=0.9.0", optional = true }
libc = { version = "0.2", optional = true }
