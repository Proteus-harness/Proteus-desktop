[workspace]
resolver = "2"
members = ["crates/client-common", "crates/diff", "crates/tabs", "crates/codex-client", "crates/terminal"]
default-members = [".", "crates/diff", "crates/tabs"]
exclude = ["vendor/gpui-fast-wgpu", "vendor/gpui-component", "vendor/gpui-base"]

[patch.crates-io]
ghostty-vt = { path = "vendor/ghostty-vt" }
ghostty-vt-sys = { path = "vendor/ghostty-vt-sys" }
gpui-fast-wgpu = { path = "vendor/gpui-fast-wgpu" }
gpui-component = { path = "vendor/gpui-component" }
gpui-base = { path = "vendor/gpui-base" }

[package]
name = "proteus-native"
version = "0.1.0-alpha.3"
edition = "2024"
publish = false
description = "Experimental native GPUI client for the Proteus app server"
license = "GPL-3.0-or-later"

[features]
default = ["ghostty-vt"]
ghostty-vt = ["proteus-terminal/ghostty-vt"]

[dependencies]
proteus-terminal = { path = "crates/terminal" }
proteus-codex-client = { path = "crates/codex-client" }
gpui-kit = { version = "=0.8.1", features = [
    "gpui-fast",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
proteus-client-common = { path = "crates/client-common" }
proteus-diff = { path = "crates/diff" }
proteus-tabs = { path = "crates/tabs" }
proteus-contracts = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "e5b9f10e9d99607856104495ab65468cbf3d7675" }
anyhow = "1"
base64 = "0.22"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
serde_yaml = "0.9"
ureq = { version = "3", default-features = false, features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
gpui = { package = "gpui-fast", version = "=0.1.12", default-features = false, features = ["test-support"] }
naga = { version = "=30.0.1", features = ["wgsl-in"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# GPUI, text shaping and tree-sitter are unusably slow unoptimized; only the
# client itself stays at opt-level 0 for quick rebuilds.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
