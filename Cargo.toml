[workspace]
resolver = "2"
members = ["crates/client-common"]
exclude = ["vendor/gpui-pre-wgpu", "vendor/gpui-component"]

[patch.crates-io]
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
gpui-component = { path = "vendor/gpui-component" }

[package]
name = "proteus-native"
version = "0.1.0-alpha.3"
edition = "2024"
publish = false
description = "Experimental native GPUI client for the Proteus app server"
license = "GPL-3.0-or-later"

[dependencies]
gpui-kit = { version = "0.7.1", features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
proteus-client-common = { path = "crates/client-common" }
proteus-contracts = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "89ebc7a2d0ec861513ccb73b5ad9b26e048e525a" }
anyhow = "1"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
markdown = "1"
serde_yaml = "0.9"
ureq = { version = "3", default-features = false, features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
alacritty_terminal = "0.25"

[dev-dependencies]
naga = { version = "29.0.4", features = ["wgsl-in"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Local portable rebuilds (`portable.py --fast`): optimized like release, but
# without LTO and in incremental pieces, so a client change rebuilds in
# seconds. The client itself is split finer, so a change recompiles little.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[profile.fast.package.proteus-native]
codegen-units = 256

# GPUI, text shaping and tree-sitter are unusably slow unoptimized; only the
# client itself stays at opt-level 0 for quick rebuilds.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
